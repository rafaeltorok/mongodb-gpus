services:
  dev-db:
    image: mongo
    container_name: mongodb-gpus-dev-db
    networks:
      - dev-network
    ports:
      - 27017:27017
    volumes:
      - ./mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dev-server:
    depends_on:
      dev-db:
        condition: service_healthy
    build:
      context: ./server
      dockerfile: dev.Dockerfile
    container_name: mongodb-gpus-dev-server
    volumes:
      - ./server:/usr/src/server
      - /usr/src/server/node_modules
    networks:
      - dev-network
    ports:
      - 4000:4000
    environment:
      - MONGODB_URI=mongodb://dev-db:27017/gpus_database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dev-client:
    depends_on:
      dev-server:
        condition: service_healthy
    build:
      context: ./client
      dockerfile: dev.Dockerfile
    container_name: mongodb-gpus-dev-client
    volumes:
      - ./client:/usr/src/client
      - /usr/src/client/node_modules
    networks:
      - dev-network
    ports:
      - 5173:5173
    environment:
      - VITE_BACKEND_URL=http://dev-server:4000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dev-alt-client:
    depends_on:
      dev-server:
        condition: service_healthy
    build:
      context: ./alternate-client
      dockerfile: dev.Dockerfile
    container_name: mongodb-gpus-dev-alt-client
    volumes:
      - ./alternate-client:/usr/src/alternate_client
      - /usr/src/alternate_client/node_modules
    networks:
      - dev-network
    ports:
      - 5174:5174
    environment:
      - VITE_BACKEND_URL=http://dev-server:4000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5174/alt"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  dev-network:
    driver: bridge
