services:
  server:
    build: ./server
    container_name: mongodb-gpus-server
    env_file:
      - ./server/.env
    expose:
      - 4000
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        - VITE_BACKEND_URL=/graphql
    container_name: mongodb-gpus-nginx
    ports:
      - 8000:80
    depends_on:
      - server
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  app-network:
    driver: bridge
